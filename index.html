<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Warband HQ — Your World of Warcraft characters, goals and progression, all in one place."
    />

    <title>Warband HQ | Your Warband. Your Journey.</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="site-header">
      <div class="container header-content">
        <a href="#" class="brand" aria-label="Warband HQ home">
          <img
            src="assets/icons/logo-warband_hq.png"
            alt=""
            class="brand-logo"
          />
          <span class="brand-name">WARBAND HQ</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#about">About</a>
          <a href="#features">Features</a>
          <a href="#developer">Developer</a>
        </nav>

        <div class="header-actions">
          <button
            class="language-switch"
            type="button"
            aria-label="Change language"
          >
            EN <span>|</span> FR
          </button>
        </div>
      </div>
    </header>

    <!-- Hero -->
    <main>
      <section class="hero">
        <div class="hero-background"></div>
        <div class="hero-overlay"></div>

        <div class="container hero-content">
          <p class="hero-eyebrow">WORLD OF WARCRAFT COMPANION</p>

          <h1>
            YOUR WARBAND.<br />
            <span>YOUR JOURNEY.</span>
          </h1>

          <h2>Everything in one place.</h2>

          <p class="hero-description">
            Your characters, your goals, your progression — all gathered in one
            place.
          </p>

          <div class="hero-actions">
            <a href="#about" class="button button-primary">
              Explore Warband HQ
            </a>

            <a
              href="https://github.com/Crypoune/wow_project_warband_hq"
              class="button button-secondary"
              target="_blank"
              rel="noopener noreferrer"
            >
              View on GitHub
            </a>
          </div>
        </div>

        <a
          href="#about"
          class="scroll-indicator"
          aria-label="Scroll to discover"
        >
          <span>SCROLL TO DISCOVER</span>
          <span class="scroll-arrow">↓</span>
        </a>
      </section>
    </main>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
  </body>
</html>
